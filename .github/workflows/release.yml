name: release (signed + notarized)

# Tag-triggered signed/notarized macOS build + GitHub Release.
#   git tag v1.1.0 && git push origin v1.1.0
#
# Signing is configured entirely through GitHub Secrets so the cert can be
# swapped without code changes. See SIGNING.md for how to populate them.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   APPLE_CERTIFICATE           base64 of your Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Nathan Brewer (2T95U247C9)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               e.g. 2T95U247C9

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write       # create the Release
      id-token: write       # sign the provenance attestation
      attestations: write   # record build provenance for the DMG
    env:
      APP_NAME: "Browser Picker"
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make this keychain searchable so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Build & sign app
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          ./build.sh

      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="build/${APP_NAME}.app"
          ZIP="$RUNNER_TEMP/notarize.zip"

          ditto -c -k --keepParent "$APP" "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/${APP_NAME}.app"
          DMG="build/${APP_NAME// /-}-${GITHUB_REF_NAME}.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      # Cryptographically tie the DMG to this exact commit + workflow run, so
      # anyone can verify the download was built from the public source:
      #   gh attestation verify <dmg> --repo nathanabrewer/browser-picker
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.DMG_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Browser Picker ${{ github.ref_name }}"
          body: |
            Signed & notarized macOS build.

            **Install:** download the `.dmg`, drag Browser Picker to Applications,
            open it once, then set it as your default browser in
            System Settings → Desktop & Dock → Default web browser.
          files: ${{ env.DMG_PATH }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
